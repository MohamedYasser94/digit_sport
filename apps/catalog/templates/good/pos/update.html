<body id="tc_body" class="header-fixed header-mobile-fixed subheader-enabled aside-enabled aside-fixed">
<!-- Paste this code after body tag -->





<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.5.17/vue.js"></script>

<div id="app">
  <select v-model="formData.allowance_id" id="allowance_id" name="allowance_id" class="form-control select2" required @input="alert('Test')">
    <option :key="'allowance_id'" value="">choose allowance</option>
    <option v-for="(allowance, index) in categories" :key="allowance.id" :value="allowance.title">
      @[[allowance.title ]]
    </option>
  </select>

  <div>
    <strong>Selected: </strong> [[formData.allowance_id]] - [[formData.title]]
  </div>

  <div>
    <button type="button" @click="onSubmit">Submit</button>
  </div>
</div>


<script>
    Vue.config.productionTip = false;
Vue.config.devtools = false;

new Vue({
  el: '#app',
     delimiters: ['[[', ']]'],
  data: () => {
    return {
        categories: {{ category_list|safe }},
      allowances: {{ category_list|safe }},
      formData: {
        allowance_id: null
      }
    };
  },
  mounted() {
    this.getallowances();

    let self = this;
    $('.select2').select2().on("change", function() {
      self.onSelectChange(this.value);
    });
  },
  methods: {
    onSelectChange(val) {
      this.formData.allowance_id = val;
    },
    onSubmit() {
      this.formData.allowance_id = $($(".select2")[0]).val();
    },
    getallowances() {
      this.allowances = [{
        id: 1,
        name: "Test"
      }];
    }

  }
});
</script>
</body>

</html>
