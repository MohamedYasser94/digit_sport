{% load static %}
 <!-- All custom scripts here -->




<script  src="{% static '' %}{{ FRONTEND_ASSETS }}/js/jquery-2.2.1.min.js"></script>
<script  src="http://maps.google.com/maps/api/js"></script>
<script  src="{% static '' %}{{ FRONTEND_ASSETS }}/bootstrap/js/bootstrap.min.js"></script>
<script  src="{% static '' %}{{ FRONTEND_ASSETS }}/js/jquery.validate.min.js"></script>
<script  src="{% static '' %}{{ FRONTEND_ASSETS }}/js/jquery.magnific-popup.min.js"></script>
<script  src="{% static '' %}{{ FRONTEND_ASSETS }}/js/blockrain.jquery.min.js"></script>
<script  src="{% static '' %}{{ FRONTEND_ASSETS }}/js/custom.js"></script>

<script>

    //  Map

    var latitude = 34.038405;
    var longitude = -117.946944;
    var markerImage = "{% static '' %}{{ FRONTEND_ASSETS }}/img/map-marker.png";
    var mapTheme = "light";
    var mapElement = "map";

    $(".modal").on("shown.bs.modal", function (e) {
        google.maps.event.addDomListener(window, 'load', simpleMap(latitude, longitude, markerImage, mapTheme, mapElement));
    });

    // Background

    window.BlockrainThemes = {
        'my': {
            background: '#ececec',
            backgroundGrid: null,
            primary: null,
            secondary: null,
            stroke: null,
            innerStroke: null,
            blocks: {
                line:     '#8dff8b',
                square:   '#ff6767',
                arrow:    '#61dfff',
                rightHook:'#ff6767',
                leftHook: '#c8c8c8',
                rightZag: '#ffe858',
                leftZag:  '#ffffff'
            }
        }
    };
    $('#background-content').blockrain({
        theme: "my",
        blockWidth: 15,
        speed: 30,
        autoplay: true,
        autoplayRestart: true
    });


</script>
