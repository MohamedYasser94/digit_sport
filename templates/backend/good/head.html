{% load i18n %}
{% load static %}

{% get_current_language as LANGUAGE_CODE %}
<!DOCTYPE html>

<html lang="en">
<!--begin::Head-->

	<!--begin::Head-->
	<head >
        {% for info in site_info %}
        <base href=""/>
		<title>{{ info.seo.meta_title }}</title>
		<meta charset="utf-8" />
		<meta name="description" content="{{ info.seo.meta_description }}." />
		<meta name="keywords" content="{{ info.seo.meta_keywords }}" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:type" content="article" />
		<meta property="og:title" content="{{ info.seo.meta_title }}" />
		<meta property="og:url" content="{{ info.site.domain }}" />
		<meta property="og:site_name" content="{{ info.seo.meta_title }}" />
		<link rel="canonical" href="{{ info.seo.meta_title }}" />
		<link rel="shortcut icon" href="{% static '' %}{{ BACKEND_ASSETS }}/media/logos/favicon.ico" />
            {% empty %}
            <base href=""/>
		<title>Xtreme</title>
		<meta charset="utf-8" />
		<meta name="description" content="Digithup admin dashboard live demo. Check out all the features of the admin panel. A large number of settings, additional services and widgets." />
		<meta name="keywords" content="Digithup, bootstrap, bootstrap 5, admin themes, Asp.Net Core &amp; Django starter kits, admin themes, bootstrap admin, bootstrap dashboard, bootstrap dark mode" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:type" content="article" />
		<meta property="og:title" content="Digithup - Bootstrap 5 HTML Asp.Net Core, Blazor, Django &amp; Flask Admin Dashboard Template" />
		<meta property="og:url" content="https://digithup.com" />
		<meta property="og:site_name" content="Digithup | Demo" />
		<link rel="canonical" href="https://digithup.com" />
		<link rel="shortcut icon" href="{% static '' %}{{ BACKEND_ASSETS }}/media/logos/favicon.ico" />
        {% endfor %}

		<!--begin::Fonts-->
		<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700" />
		<!--end::Fonts-->
		<!--begin::Vendor Stylesheets(used by this page)-->
		<link href="{% static '' %}{{ BACKEND_ASSETS }}/plugins/custom/datatables/datatables.bundle.css" rel="stylesheet" type="text/css" />
		<link href="{% static '' %}{{ BACKEND_ASSETS }}/plugins/custom/vis-timeline/vis-timeline.bundle.css" rel="stylesheet" type="text/css" />
		<!--end::Vendor Stylesheets-->
		<!--begin::Global Stylesheets Bundle(used by all pages)-->
		<link href="{% static '' %}{{ BACKEND_ASSETS }}/plugins/global/plugins.bundle.css" rel="stylesheet" type="text/css" />
		<link href="{% static '' %}{{ BACKEND_ASSETS }}/css/style.bundle.css" rel="stylesheet" type="text/css" />
		<!--end::Global Stylesheets Bundle-->
    <script src="{% static 'vue3.min.js' %}"></script>



{% block custom_css %} {% endblock custom_css %}
