{% load i18n %}

<!DOCTYPE html>
{% load static %}

<html lang="en">
	<!--begin::Head-->
	<head>
     <title>404</title>
		{% for setting in site_info %}
    <base href="">

    <meta charset="utf-8"/>
    <meta name="description"
          content="{{ setting.seo_setting.meta_description }}"/>
    <meta name="keywords"
          content="{{ setting.seo_setting.meta_keywords }}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta property="og:locale" content="en_US"/>
    <meta property="og:type" content="article"/>
    <meta property="og:title" content="{{ setting.seo_setting.meta_title }} "/>
    <meta property="og:url"
          content="https://Digithup.com/"/>
    <meta property="og:site_name" content="Digithup | LawHup"/>
    <link rel="canonical" href="https://lawhup.com/"/>
{% endfor %}
    <link rel="shortcut icon" href="{% static '' %}{{ BACKEND_ASSETS }}/media/logos/favicon.ico"/>
		<!--begin::Fonts-->
		<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" />
		<!--end::Fonts-->
		<!--begin::Global Stylesheets Bundle(used by all pages)-->
		<link href="{% static '' %}{{ BACKEND_ASSETS }}/plugins/global/plugins.bundle.css" rel="stylesheet" type="text/css" />
		<link href="{% static '' %}{{ BACKEND_ASSETS }}/{% static '' %}frontend/css/style.bundle.css" rel="stylesheet" type="text/css" />
		<!--end::Global Stylesheets Bundle-->
	</head>
	<!--end::Head-->
	<!--begin::Body-->
	<body id="kt_body" class="auth-bg">
		<!--begin::Main-->
		<!--begin::Root-->
		<div class="d-flex flex-column flex-root">
			<!--begin::Authentication - 404 Page-->
			<div class="d-flex flex-column flex-center flex-column-fluid p-10">
				<!--begin::Illustration-->
				<img src="https://www.lawhup.net/static/digithup/18.png" alt="" class="mw-100 mb-10 h-lg-450px" />
				<!--end::Illustration-->
				<!--begin::Message-->
				<h1 class="fw-bold mb-10" style="color: #A3A3C7">{% translate 'Seems there is nothing here' %}</h1>
				<!--end::Message-->
				<!--begin::Link-->
				<a href="{% url 'home:HomeIndex' %}" class="btn btn-primary">{% translate 'Return Home' %}</a>
				<!--end::Link-->
			</div>
			<!--end::Authentication - 404 Page-->
		</div>
		<!--end::Root-->
		<!--end::Main-->
		<!--begin::Javascript-->
		<script>var hostUrl = "{% static '' %}{{ BACKEND_ASSETS }}/";</script>
		<!--begin::Global Javascript Bundle(used by all pages)-->
		<script src="{% static '' %}{{ BACKEND_ASSETS }}/plugins/global/plugins.bundle.js"></script>
		<script src="{% static '' %}{{ BACKEND_ASSETS }}/js/scripts.bundle.js"></script>
		<!--end::Global Javascript Bundle-->
		<!--end::Javascript-->
	</body>
	<!--end::Body-->
</html>
