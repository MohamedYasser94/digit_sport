{% load i18n %}

<!DOCTYPE html>
{% load static %}

<html lang="en">
	<!--begin::Head-->
	<head>
     <title>403</title>
		{% for setting in site_info %}
    <base href="">

    <meta charset="utf-8"/>
    <meta name="description"
          content="{{ setting.seo_setting.meta_description }}"/>
    <meta name="keywords"
          content="{{ setting.seo_setting.meta_keywords }}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta property="og:locale" content="en_US"/>
    <meta property="og:type" content="article"/>
    <meta property="og:title" content="{{ setting.seo_setting.meta_title }} "/>
    <meta property="og:url"
          content="https://Digithup.com/"/>
    <meta property="og:site_name" content="Digithup | LawHup"/>
    <link rel="canonical" href="https://lawhup.com/"/>
{% endfor %}
    <link rel="shortcut icon" href="{% static '' %}{{ BACKEND_ASSETS }}/media/logos/favicon.ico"/>
		<!--begin::Fonts-->
		<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" />
		<!--end::Fonts-->
		<!--begin::Global Stylesheets Bundle(used by all pages)-->
		<link href="{% static '' %}{{ BACKEND_ASSETS }}/plugins/global/plugins.bundle.css" rel="stylesheet" type="text/css" />
		<link href="{% static '' %}{{ BACKEND_ASSETS }}/{% static '' %}frontend/css/style.bundle.css" rel="stylesheet" type="text/css" />
		<!--end::Global Stylesheets Bundle-->
	</head>
	<!--end::Head-->
	<!--begin::Body-->
	<body id="kt_body" class="auth-bg">
		<!--begin::Main-->
		<!--begin::Root-->
		<div class="d-flex flex-column flex-root">
			<!--begin::Authentication - Error 500 -->
			<div class="d-flex flex-column flex-column-fluid">
				<!--begin::Content-->
				<div class="d-flex flex-row-fluid flex-column flex-column-fluid text-center p-10 py-lg-20">
					<!--begin::Logo-->
					<a href="" class="pt-lg-20 mb-12">
						<img alt="Logo" src="{% static '' %}digithup/upmix.png" class="h-250px" />
					</a>
					<!--end::Logo-->
					<!--begin::Logo-->
					<h1 class="fw-bolder fs-2qx text-gray-800 mb-10">{% translate 'System Error' %}</h1>
					<!--end::Logo-->
					<!--begin::Message-->
					<div class="fw-bold fs-3 text-muted mb-15">{% translate 'Something went wrong!' %}
					<br />{% translate 'Please try again later.' %}</div>
					<!--end::Message-->
					<!--begin::Action-->
					<div class="text-center">
						<a href="{% url 'home:HomeIndex' %}" class="btn btn-lg btn-primary fw-bolder">{% translate 'Go to homepage' %}</a>
					</div>
					<!--end::Action-->
				</div>
				<!--end::Content-->
				<!--begin::Illustration-->
				<div class="d-flex flex-row-auto bgi-no-repeat bgi-position-x-center bgi-size-contain bgi-position-y-bottom min-h-150px min-h-lg-350px" style="background-image: url({% static '' %}{{ BACKEND_ASSETS }}/media/illustrations/sketchy-1/7.png)"></div>
				<!--end::Illustration-->
			</div>
			<!--end::Authentication - Error 500-->
		</div>
		<!--end::Root-->
		<!--end::Main-->
		<!--begin::Javascript-->
		<script>var hostUrl = "{% static '' %}{{ BACKEND_ASSETS }}/";</script>
		<!--begin::Global Javascript Bundle(used by all pages)-->
		<script src="{% static '' %}{{ BACKEND_ASSETS }}/plugins/global/plugins.bundle.js"></script>
		<script src="{% static '' %}{{ BACKEND_ASSETS }}/js/scripts.bundle.js"></script>
		<!--end::Global Javascript Bundle-->
		<!--end::Javascript-->
	</body>
	<!--end::Body-->
</html>
