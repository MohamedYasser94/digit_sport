{% load static %}
{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
<div class="d-flex flex-column flex-lg-row-auto bg-primary w-xl-600px positon-xl-relative">

    <!--begin::Wrapper-->
    <div class="d-flex flex-column position-xl-fixed top-0 bottom-0 w-xl-600px scroll-y">
        <!--begin::Header-->

        <div class="d-flex flex-row-fluid flex-column text-center p-10 pt-lg-5">
            <!--begin::Logo-->
            <a href="{% url 'home:HomeIndex' %}" class="py-9 pt-lg-10">
                <img alt="Logo" src="{% static '' %}Digithup/textwhite.png"
                     class="h-250px"/>
            </a>
            <!--end::Logo-->
            <!--begin::Title-->
            <h1 class="fw-bolder text-white fs-2qx pb-5 pb-md-10">{% translate 'Welcome' %}<br></h1>
            <!--end::Title-->

            <p class="fw-bold fs-2 text-white">{% translate 'Your Office By one Click' %}
                <br/>{% translate 'We know Your Work Difficult , We Just Make It Easier' %}</p>
            <!--end::Description-->
        </div>
        <!--end::Header-->
        <!--begin::Illustration-->
        <div class="d-flex flex-row-auto bgi-no-repeat bgi-position-x-center bgi-size-contain bgi-position-y-bottom min-h-100px min-h-lg-350px"
             style="background-image: url({% static '' %}{{ BACKEND_ASSETS }}/media/illustrations/sketchy-1/2.png)"></div>

    </div>
    <!--end::Wrapper-->
